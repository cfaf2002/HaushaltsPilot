name: Handy-App (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Web-App in die APK übernehmen
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: APK bauen
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle --no-daemon assembleRelease 2>&1 | tee build.log; then
            grep -E "error:|e: |What went wrong|Could not|FAILED|Exception" -A3 build.log | head -40 | while IFS= read -r z; do echo "::error::$z"; done
            exit 1
          fi

      - name: APK benennen
        run: cp android/app/build/outputs/apk/release/app-release.apk HaushaltsPilot.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: handy-${{ github.run_number }}
          name: HaushaltsPilot Handy-App (Build ${{ github.run_number }})
          body: |
            Auf dem Handy herunterladen und installieren: HaushaltsPilot.apk
            Direktlink zur jeweils neuesten Version:
            https://github.com/cfaf2002/HaushaltsPilot/releases/latest/download/HaushaltsPilot.apk
          files: HaushaltsPilot.apk
          make_latest: true
