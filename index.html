<style>
/* Layout: eine Spalte wie eine native App - Kopfband, Inhalt, feste Leiste unten mit drei Bereichen */
:root{
  --bg:#f1f3f7; --karte:#ffffff; --linie:#dde2ea; --text:#14213d; --ged:#5f697d;
  --prim:#24375e; --primh:#3a5285; --akz:#c0661a; --rot:#b42318; --gruen:#3f7d3a;
  --bar:#e6eaf1; --chip:#eef1f6;
  --f-text:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-zahl:system-ui,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1624; --karte:#18223a; --linie:#2a3654; --text:#e8ecf4; --ged:#9aa6bd;
  --prim:#2b4373; --primh:#3b5a96; --akz:#e08a3e; --rot:#f0786b; --gruen:#7cc274;
  --bar:#24304b; --chip:#22304d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1624; --karte:#18223a; --linie:#2a3654; --text:#e8ecf4; --ged:#9aa6bd;
  --prim:#2b4373; --primh:#3b5a96; --akz:#e08a3e; --rot:#f0786b; --gruen:#7cc274;
  --bar:#24304b; --chip:#22304d; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-text);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
.kopf{background:#24375e;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.kopf img{width:30px;height:30px;border-radius:7px}
.kopf .name{font-weight:650;font-size:17px;letter-spacing:.01em}
.kopf .name b{color:#f0a35a;font-weight:650}
.kopf .stand{margin-left:auto;font-size:12px;opacity:.8;text-align:right}
main{max-width:560px;margin:0 auto;padding-block:14px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ged);margin:0;font-weight:650}
.hinweis{font-size:13px;color:var(--ged);margin:0}
.banner{background:var(--chip);border:1px dashed var(--linie);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ged)}
label{font-size:13px;color:var(--ged);display:block;margin-bottom:4px}
input[type=text],input[type=date],input[type=search]{width:100%;border:1px solid var(--linie);background:var(--karte);border-radius:9px;padding:10px 12px;min-height:44px}
input:focus-visible,button:focus-visible{outline:2px solid var(--akz);outline-offset:2px}
.betrag{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--linie);padding-bottom:4px}
.betrag input{border:0;background:transparent;font-family:var(--f-zahl);font-size:38px;font-weight:650;width:100%;min-width:0;padding:0;font-variant-numeric:tabular-nums}
.betrag input:focus{outline:none}
.betrag:focus-within{border-color:var(--akz)}
.betrag span{font-size:26px;color:var(--ged)}
.reihe{display:flex;gap:10px;flex-wrap:wrap}
.reihe>*{flex:1 1 140px;min-width:0}
.knopf{border:1px solid #8a9bbd;background:var(--karte);border-radius:10px;min-height:46px;padding:0 16px;font-weight:600;cursor:pointer}
.knopf.haupt{background:var(--prim);border-color:var(--prim);color:#fff}
.knopf.haupt:hover{background:var(--primh)}
.knopf.weg{color:var(--rot);border-color:var(--linie)}
.knopf:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--linie);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--prim);border-color:var(--prim);color:#fff}
.gewaehlt{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:10px;padding:10px 12px}
.gewaehlt .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gewaehlt .k{font-size:12px;color:var(--ged)}
.gewaehlt button{margin-left:auto;border:0;background:none;color:var(--akz);font-weight:600;cursor:pointer;padding:6px}
.art{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 6px}
.art.A{background:color-mix(in srgb,var(--rot) 14%,transparent);color:var(--rot)}
.art.E{background:color-mix(in srgb,var(--gruen) 16%,transparent);color:var(--gruen)}
.liste{max-height:300px;overflow-y:auto;border:1px solid var(--linie);border-radius:10px}
.liste .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ged);padding:8px 12px 4px;background:var(--bg);position:sticky;top:0}
.liste button{display:flex;width:100%;text-align:left;border:0;border-top:1px solid var(--linie);background:var(--karte);padding:11px 12px;cursor:pointer;gap:8px;align-items:center}
.liste button:hover{background:var(--chip)}
.zeile{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--linie)}
.zeile:first-child{border-top:0}
.zeile .d{font-size:12px;color:var(--ged);font-variant-numeric:tabular-nums}
.zeile .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile .n small{display:block;color:var(--ged);font-size:12px}
.zeile .b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.zeile .b.A{color:var(--text)} .zeile .b.E{color:var(--gruen)}
.zeile .x{border:0;background:none;color:var(--ged);cursor:pointer;padding:6px 8px;border-radius:8px;font-size:13px}
.zeile .x.sicher{background:var(--rot);color:#fff}
.status{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--ged);margin-left:6px}
.status.gesendet{color:var(--akz)}
.summe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.summe div{background:var(--chip);border-radius:10px;padding:9px 8px;min-width:0}
.summe small{display:block;font-size:11px;color:var(--ged);text-transform:uppercase;letter-spacing:.05em}
.summe b{display:block;font-size:clamp(13px,4vw,17px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest.minus{color:var(--rot)} .rest.plus{color:var(--gruen)}
.kat{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-top:1px solid var(--linie)}
.kat:first-child{border-top:0}
.kat .oben{display:flex;gap:8px;align-items:baseline}
.kat .oben .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kat .oben .r{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.balken{height:8px;background:var(--bar);border-radius:5px;overflow:hidden;position:relative}
.balken i{position:absolute;inset:0 auto 0 0;background:var(--prim);border-radius:5px}
.balken i.h{background:var(--akz);opacity:.85}
.balken.ueber i{background:var(--rot)}
.kat .unten{font-size:12px;color:var(--ged);font-variant-numeric:tabular-nums}
.leiste{position:fixed;left:0;right:0;bottom:0;background:var(--karte);border-top:1px solid var(--linie);display:flex;z-index:6;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.leiste button{flex:1;border:0;background:none;padding:10px 4px 12px;cursor:pointer;color:var(--ged);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.leiste button svg{width:22px;height:22px}
.leiste button[aria-current="page"]{color:var(--akz)}
.zahl{position:absolute;top:5px;left:calc(50% + 6px);background:var(--akz);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center}
.leer{color:var(--ged);font-size:14px;padding:6px 0}
.fehler{color:var(--rot);font-size:13px;margin:0}
@media (prefers-reduced-motion:no-preference){.balken i{transition:width .3s}}
</style>

    const hb = plan > 0 ? Math.min(100, k.handy / plan * 100) : 0;
    lb.append(h("div", {class: "kat"},
      h("div", {class: "oben"}, h("span", {class: "n"}, k.k), h("span", {class: "r rest " + (rest < 0 ? "minus" : "")}, rest >= 0 ? "noch " + EUR.format(rest) : EUR.format(-rest) + " drüber")),
      h("div", {class: "balken" + (rest < 0 ? " ueber" : ""), role: "img", "aria-label": EUR.format(gesamt) + " von " + EUR.format(plan)},
        h("i", {style: "width:" + breite.toFixed(1) + "%"}), k.handy > 0 && rest >= 0 ? h("i", {class: "h", style: "left:" + Math.max(0, breite - hb).toFixed(1) + "%;width:" + hb.toFixed(1) + "%"}) : null),
      h("div", {class: "unten"}, EUR.format(gesamt) + " von " + EUR.format(plan) + (k.handy > 0 ? "  ·  davon Handy " + EUR.format(k.handy) : ""))));
  }
  liste.append(lb);
  teile.push(liste);
  if (ein.length) {
    const ep = sum(ein, "plan"), ei = sum(ein, "ist") + sum(ein, "handy");
    teile.push(h("div", {class: "karte"}, h("h2", {}, "Einnahmen"),
      h("div", {class: "summe"},
        h("div", {}, h("small", {}, "Plan"), h("b", {}, EUR.format(ep))),
        h("div", {}, h("small", {}, "Eingegangen"), h("b", {}, EUR.format(ei))),
        h("div", {}, h("small", {}, "Offen"), h("b", {}, EUR.format(Math.max(0, ep - ei)))))));
  }
  const f = D.faellig || [];
  const fk = h("div", {class: "karte"}, h("h2", {}, "Fällig in den nächsten 60 Tagen"));
  if (!f.length) fk.append(h("div", {class: "leer"}, "Nichts fällig."));
  for (const x of f) fk.append(h("div", {class: "zeile", style: "grid-template-columns:auto 1fr auto"},
    h("span", {class: "d"}, datumKurz(x.d)), h("span", {class: "n"}, x.n), h("span", {class: "b"}, EUR.format(x.b))));
  teile.push(fk);
  return teile;
}

/* ---------- Austausch ---------- */
function ansichtAustausch() {
  const D = S.daten, o = offen();
  const datei = h("input", {id: "datei", type: "file", hidden: true, onchange: dateiLaden});
  const k1 = h("div", {class: "karte"},
    h("h2", {}, "1 · Übersicht vom PC laden"),
    h("p", {class: "hinweis"}, D && !D.demo ? "Geladen: Stand vom " + String(D.stand || "").replace(/^(\d{4})-(\d\d)-(\d\d)/, "$3.$2.$1") + " Uhr." : "Wählen Sie die Datei HaushaltsPilot_Handy.json aus Ihrem Austauschordner (z. B. in OneDrive)."),
    datei,
    h("button", {class: "knopf haupt", id: "laden", onclick: () => datei.click()}, "Datei vom PC laden"),
    h("p", {class: "fehler", id: "ladeFehler", hidden: true}));
  const k2 = h("div", {class: "karte"},
    h("h2", {}, "2 · Buchungen an den PC senden"),
    h("p", {class: "hinweis"}, o.length ? o.length + " Buchung(en) sind noch nicht am PC angekommen. Speichern Sie die Datei im selben Austauschordner. Doppelt senden schadet nicht." : "Keine offenen Buchungen."),
    h("button", {class: "knopf haupt", id: "senden", disabled: !o.length, onclick: senden}, o.length ? "Senden (" + o.length + ")" : "Senden"),
    h("p", {class: "hinweis"}, "Am PC übernimmt der HaushaltsPilot die Buchungen beim nächsten Start oder mit Einstellungen › Jetzt abgleichen. Danach hier erneut die Übersicht laden – angekommene Buchungen verschwinden aus der Liste."));
  const k3 = h("div", {class: "karte"}, h("h2", {}, "Auf diesem Handy"));
  if (installEvent) k3.append(h("button", {class: "knopf", id: "installieren", onclick: async () => { installEvent.prompt(); installEvent = null; zeichnen(); }}, "Als App installieren"));
  k3.append(h("div", {class: "reihe"},
    h("button", {class: "knopf", id: "demo", onclick: () => { S.daten = beispiel(); speichern(); meldung("Beispieldaten geladen"); zeichnen(); }}, "Beispieldaten laden"),
    h("button", {class: "knopf weg", id: "alles", onclick: () => {
      if (loeschFrage !== "*") { loeschFrage = "*"; zeichnen(); return; }
      S = {daten: null, buchungen: [], zuletzt: []}; loeschFrage = null;
      try { localStorage.removeItem(SPEICHER); } catch (e) {}
      meldung("Alle Daten auf diesem Handy gelöscht"); zeichnen();
    }}, loeschFrage === "*" ? "Wirklich alles löschen?" : "Alle Daten löschen")));
  k3.append(h("p", {class: "hinweis"}, "Ihre Daten bleiben auf diesem Handy und in Ihrem Austauschordner. Die App sendet nichts ins Internet."));
  return [k1, k2, k3];
}
function dateiLaden(e) {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const fehler = t => { const el = document.getElementById("ladeFehler"); if (el) { el.textContent = t; el.hidden = false; } };
  if (f.size > 3 * 1048576) { fehler("Die Datei ist zu groß. Bitte HaushaltsPilot_Handy.json wählen."); return; }
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(String(r.result).replace(/^﻿/, "")); } catch (x) { fehler("Die Datei ist keine gültige Übersicht. Bitte HaushaltsPilot_Handy.json wählen."); return; }
    if (!d || d.app !== "HaushaltsPilot" || d.v !== 1 || !Array.isArray(d.positionen) || typeof d.stand !== "string" ||
        !Number.isInteger(d.jahr) || !Number.isInteger(d.monat) || d.monat < 1 || d.monat > 12) { fehler("Das ist nicht die Übersicht vom HaushaltsPilot (HaushaltsPilot_Handy.json)."); return; }
    d.positionen = d.positionen.filter(p => p && Number.isInteger(p.id) && typeof p.n === "string").map(p => ({id: p.id, n: p.n, k: String(p.k || ""), a: p.a === "E" ? "E" : "A"}));
    d.kategorien = Array.isArray(d.kategorien) ? d.kategorien : [];
    d.faellig = Array.isArray(d.faellig) ? d.faellig : [];
    if (typeof d.bankBis !== "string") d.bankBis = null;
    const da = new Set(Array.isArray(d.importiert) ? d.importiert.map(String) : []);
    const vorher = S.buchungen.length;
    S.buchungen = S.buchungen.filter(b => !da.has(b.id));
    const angekommen = vorher - S.buchungen.length;
    S.daten = d;
    speichern();
    meldung("Übersicht geladen" + (angekommen ? " · " + angekommen + " Buchung(en) am PC angekommen" : ""));
    zeichnen();
  };
  r.onerror = () => fehler("Die Datei konnte nicht gelesen werden.");
  r.readAsText(f, "utf-8");
}
async function senden() {
  const o = offen();
  if (!o.length) return;
  const jetzt = new Date(), z = n => String(n).padStart(2, "0");
  const name = "HP_Handy_" + jetzt.getFullYear() + z(jetzt.getMonth() + 1) + z(jetzt.getDate()) + "-" + z(jetzt.getHours()) + z(jetzt.getMinutes()) + z(jetzt.getSeconds()) + ".json";
  const inhalt = JSON.stringify({app: "HaushaltsPilot-Handy", v: 1, erstellt: jetzt.toISOString(),
    buchungen: o.map(b => ({id: b.id, d: b.d, b: b.b, pos: b.pos, art: b.art, t: b.t}))});
  const blob = new Blob([inhalt], {type: "application/json"});
  let ok = false;
  if (window.HPAndroid) {
    try { ok = HPAndroid.teilen(name, inhalt) === true; } catch (x) { ok = false; }
    if (!ok) { meldung("Senden war nicht möglich."); return; }
    for (const x of o) x.status = "gesendet";
    speichern(); zeichnen();
    meldung("Bitte im Austauschordner speichern (z. B. OneDrive › HaushaltsPilot).");
    return;
  }
  try {
    const file = new File([blob], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      await navigator.share({files: [file], title: name});
      ok = true;
    }
  } catch (x) {
    if (x && x.name === "AbortError") { meldung("Senden abgebrochen"); return; }
  }
  if (!ok) {
    try {
      const url = URL.createObjectURL(blob);
      const a = h("a", {href: url, download: name}); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      ok = true;
      meldung("Datei " + name + " unter Downloads gespeichert – bitte in den Austauschordner verschieben.");
    } catch (x) { meldung("Senden ist hier nicht möglich. Bitte die installierte App verwenden."); return; }
  } else meldung("Datei übergeben – bitte im Austauschordner speichern.");
  for (const b of o) b.status = "gesendet";
  speichern(); zeichnen();
}

/* ---------- Beispiel ---------- */
function beispiel() {
  const d = new Date(), j = d.getFullYear(), m = d.getMonth() + 1, z = n => String(n).padStart(2, "0");
  const tag = n => { const x = new Date(j, m - 1, d.getDate() + n); return x.getFullYear() + "-" + z(x.getMonth() + 1) + "-" + z(x.getDate()); };
  const P = [[1,"Lebensmittel","Haushalt","A"],[2,"Drogerie","Haushalt","A"],[3,"Wochenmarkt","Haushalt","A"],[4,"Tanken","Auto","A"],[5,"Parken","Auto","A"],
    [6,"Restaurant","Freizeit","A"],[7,"Kino & Kultur","Freizeit","A"],[8,"Geschenke","Sonstiges","A"],[9,"Apotheke","Gesundheit","A"],[10,"Flohmarkt-Verkauf","Nebeneinnahmen","E"]];
  return {app: "HaushaltsPilot", v: 1, demo: true, stand: j + "-" + z(m) + "-" + z(d.getDate()) + " 08:00", jahr: j, monat: m,
    positionen: P.map(p => ({id: p[0], n: p[1], k: p[2], a: p[3]})),
    kategorien: [{k:"Haushalt",a:"A",plan:620,ist:388.4},{k:"Auto",a:"A",plan:240,ist:131.9},{k:"Freizeit",a:"A",plan:150,ist:164.5},
      {k:"Gesundheit",a:"A",plan:40,ist:12.95},{k:"Sonstiges",a:"A",plan:60,ist:0},{k:"Nebeneinnahmen",a:"E",plan:50,ist:20}],
    faellig: [{d: tag(6), n: "Kfz-Versicherung", b: 412.8}, {d: tag(19), n: "Grundsteuer", b: 96.5}, {d: tag(41), n: "Hausrat & Haftpflicht", b: 138}],
    bankBis: tag(-4), importiert: []};
}

/* ---------- Rahmen ---------- */
function zeichnen() {
  const m = document.getElementById("inhalt");
  const y = window.scrollY;
  m.textContent = "";
  const teile = tab === "erfassen" ? ansichtErfassen() : tab === "uebersicht" ? ansichtUebersicht() : ansichtAustausch();
  m.append(...teile);
  document.querySelectorAll(".leiste button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const n = offen().length, z = document.getElementById("zahlOffen");
  z.hidden = !n; z.textContent = n;
  const ks = document.getElementById("kopfStand");
  ks.textContent = S.daten ? (S.daten.demo ? "Beispiel" : "PC-Stand " + datumKurz(String(S.daten.stand).slice(0, 10))) : "";
  window.scrollTo(0, y);
}
function wechseln(t) { tab = t; loeschFrage = null; window.scrollTo(0, 0); zeichnen(); }
document.querySelectorAll(".leiste button").forEach(b => b.addEventListener("click", () => wechseln(b.dataset.tab)));
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; if (tab === "austausch") zeichnen(); });
document.getElementById("logo").src = LOGO;
laden();
if (!S.daten && VORSCHAU) S.daten = beispiel();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
zeichnen();
</script>
<script>
if (!window.HPAndroid && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
